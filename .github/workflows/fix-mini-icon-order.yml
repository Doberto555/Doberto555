name: Fix MINI icon and project order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use working bot image and move newest project first
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          working_icon = 'https://doberto-minibot-v1.vercel.app/bot-image.jpg'

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          for old in [
              'https://raw.githubusercontent.com/Doberto555/DOBERTO-MINI-BOT-V1/main/bot-logo-v4.svg',
              'https://doberto-minibot-v1.vercel.app/bot-logo-v4.svg',
              'assets/project-icons/doberto-mini-md.svg'
          ]:
              text = text.replace(old, working_icon)

          pattern = r'(<article class="project reveal" style="--accent:#25d366">.*?</article>)'
          m = re.search(pattern, text, flags=re.S)
          if not m:
              raise SystemExit('DOBERTO MINI MD project card not found')
          card = m.group(1)
          text = text[:m.start()] + text[m.end():]
          marker = '<div class="project-list">'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('project-list marker not found')
          insert_at = idx + len(marker)
          text = text[:insert_at] + '\n' + card + text[insert_at:]
          p.write_text(text, encoding='utf-8')

          p = Path('case-studies/doberto-mini-md.html')
          text = p.read_text(encoding='utf-8')
          for old in [
              'https://raw.githubusercontent.com/Doberto555/DOBERTO-MINI-BOT-V1/main/bot-logo-v4.svg',
              'https://doberto-minibot-v1.vercel.app/bot-logo-v4.svg',
              '../assets/project-icons/doberto-mini-md.svg'
          ]:
              text = text.replace(old, working_icon)
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-mini-icon-order.yml
      - name: Commit final fix
        run: |
          git config user.name "DOBERTO MRLIT DEV"
          git config user.email "235633378+Doberto555@users.noreply.github.com"
          git add -A
          git commit -m "Show MINI bot icon and newest project first"
          git pull --rebase origin main
          git push origin main
