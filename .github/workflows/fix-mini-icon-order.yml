name: Fix MINI icon and project order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add local icon and move newest project first
        run: |
          set -e
          mkdir -p assets/project-icons
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/Doberto555/DOBERTO-MINI-BOT-V1/main/bot-logo-v4.svg \
            -o assets/project-icons/doberto-mini-md.svg
          grep -q '<svg' assets/project-icons/doberto-mini-md.svg
          python - <<'PY'
          from pathlib import Path
          import re

          # Homepage: local icon + newest project first
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('https://raw.githubusercontent.com/Doberto555/DOBERTO-MINI-BOT-V1/main/bot-logo-v4.svg', 'assets/project-icons/doberto-mini-md.svg')
          text = text.replace('https://doberto-minibot-v1.vercel.app/bot-logo-v4.svg', 'assets/project-icons/doberto-mini-md.svg')

          pattern = r'(<article class="project reveal" style="--accent:#25d366">.*?</article>)'
          m = re.search(pattern, text, flags=re.S)
          if not m:
              raise SystemExit('DOBERTO MINI MD project card not found')
          card = m.group(1)
          text = text[:m.start()] + text[m.end():]
          marker = '<div class="project-list">'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('project-list marker not found')
          insert_at = idx + len(marker)
          text = text[:insert_at] + '\n' + card + text[insert_at:]
          p.write_text(text, encoding='utf-8')

          # Case study: local icon path
          p = Path('case-studies/doberto-mini-md.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('https://raw.githubusercontent.com/Doberto555/DOBERTO-MINI-BOT-V1/main/bot-logo-v4.svg', '../assets/project-icons/doberto-mini-md.svg')
          text = text.replace('https://doberto-minibot-v1.vercel.app/bot-logo-v4.svg', '../assets/project-icons/doberto-mini-md.svg')
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-mini-icon-order.yml
      - name: Commit final fix
        run: |
          git config user.name "DOBERTO MRLIT DEV"
          git config user.email "235633378+Doberto555@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix MINI icon and show newest project first"
          git pull --rebase origin main
          git push origin main
