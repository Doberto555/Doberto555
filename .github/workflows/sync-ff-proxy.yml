name: Sync DOBERTO FF PROXY
on:
  push:
    paths: ['.github/workflows/sync-ff-proxy.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new project to portfolio
        shell: python
        run: |
          from pathlib import Path
          import json
          root=Path('.')
          icon='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="bg" x1="18" y1="8" x2="110" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#151B28"/><stop offset="1" stop-color="#070A10"/></linearGradient><linearGradient id="hot" x1="30" y1="20" x2="98" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#FF6B35"/><stop offset=".55" stop-color="#FF3B30"/><stop offset="1" stop-color="#C9232D"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" stroke="#293246" stroke-width="4"/><path d="M64 18 101 32v29c0 24-14 40-37 50C41 101 27 85 27 61V32l37-14Z" fill="url(#hot)"/><path d="M64 27 92 38v22c0 18-10 30-28 39-18-9-28-21-28-39V38l28-11Z" fill="#0A0E16" opacity=".82"/><circle cx="47" cy="55" r="6" fill="#fff"/><circle cx="82" cy="48" r="6" fill="#fff"/><circle cx="76" cy="81" r="6" fill="#fff"/><path d="M51 55 77 49M50 59l22 19M80 54l-3 21" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".92"/><path d="m64 39-12 25h11l-5 25 19-31H65l8-19H64Z" fill="#FF5A3D" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>'''
          (root/'assets/project-icons/doberto-ff-proxy.svg').write_text(icon)
          p=root/'index.html'; s=p.read_text()
          card='''<article class="project reveal" style="--accent:#ff5a3d"><div class="product-mark"><img src="assets/project-icons/doberto-ff-proxy.svg" width="82" height="82" alt="DOBERTO FF PROXY icon" decoding="async" data-fallback="FF"></div><div class="project-main"><div class="project-title-row"><h3>DOBERTO FF PROXY</h3><span class="live"><span class="live-dot"></span>Live</span><span class="source-private">Private source</span><span class="domain">doberto-ff-proxy.vercel.app</span></div><p>Gaming proxy dashboard with Google sign-in, first-login registration, protected access and server status tools.</p><div class="chips"><span class="chip">Web</span><span class="chip">Supabase</span><span class="chip">Google OAuth</span><span class="chip">Gaming</span></div></div><div class="project-actions"><a class="primary" href="https://doberto-ff-proxy.vercel.app" target="_blank" rel="noopener">Open live<span class="icon"><svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span></a><a href="case-studies/doberto-ff-proxy.html">Case study<span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></a></div></article>\n'''
          marker='<div class="project-list">\n'
          if 'DOBERTO FF PROXY</h3>' not in s: s=s.replace(marker,marker+card,1)
          s=s.replace('<small>Products</small><b>6</b>','<small>Products</small><b>7</b>').replace('<small>Current</small><b>NOVATOP</b>','<small>Current</small><b>DOBERTO FF PROXY</b>')
          s=s.replace('Developer behind DOBERTO FLIX, AYITI MARKET, DOBERTO MD V3, DOBERTO VCF, DOBERTO MINI MD and NOVATOP.','Developer behind DOBERTO FF PROXY, DOBERTO MINI MD, DOBERTO FLIX, AYITI MARKET, DOBERTO MD V3, DOBERTO VCF and NOVATOP.')
          s=s.replace('assets/portfolio-ui.js?v=20260915-auto1','assets/portfolio-ui.js?v=20260918-ffproxy1')
          p.write_text(s)
          p=root/'assets/portfolio-ui.js'; js=p.read_text()
          en="    {desc:'Gaming proxy dashboard with Google sign-in, first-login registration, protected access and server status tools.',chips:['Web','Supabase','Google OAuth','Gaming']},\n"
          fr="    {desc:'Tableau de bord proxy gaming avec connexion Google, inscription au premier accès, espace protégé et outils d’état des serveurs.',chips:['Web','Supabase','Google OAuth','Gaming']},\n"
          if 'Gaming proxy dashboard with Google sign-in' not in js:
            js=js.replace('  en:[\n','  en:[\n'+en,1).replace('  fr:[\n','  fr:[\n'+fr,1)
          p.write_text(js)
          case='''<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOBERTO FF PROXY — Étude de cas | DOBERTO MRLIT DEV</title><meta name="description" content="DOBERTO FF PROXY, tableau de bord gaming avec authentification Google, inscription et gestion de serveurs."><link rel="canonical" href="https://dobertomrlit.zone.id/case-studies/doberto-ff-proxy.html"><link rel="stylesheet" href="../assets/portfolio.css?v=20260912-pro1"><link rel="stylesheet" href="../assets/portfolio-polish.css?v=20260905-cinematic7"><link rel="stylesheet" href="../assets/final-clean.css?v=20260912-pro2"><style>body{padding:6vw}.case{max-width:1100px;margin:auto}.back{display:inline-block;margin-bottom:48px}.heroicon{width:112px;height:112px;border-radius:28px}.case h1{font-size:clamp(52px,9vw,120px);line-height:.9;margin:24px 0}.case p{font-size:clamp(18px,2vw,25px);line-height:1.6;max-width:850px}.case .btn{margin-top:28px}</style></head><body><main class="case"><a class="back" href="../index.html#work">← Portfolio</a><img class="heroicon" src="../assets/project-icons/doberto-ff-proxy.svg" alt="DOBERTO FF PROXY icon"><h1>DOBERTO FF PROXY</h1><p>Plateforme web responsive conçue pour centraliser une expérience de proxy gaming autorisée : connexion Google via Supabase, inscription au premier accès, tableau de bord protégé, cartes de serveurs, état/ping et parcours de connexion rapide.</p><p>Le produit privilégie une interface mobile stable et une architecture prête à être reliée à une infrastructure proxy autorisée, sans contournement anti-cheat ni modification du jeu.</p><a class="btn btn-primary" href="https://doberto-ff-proxy.vercel.app" target="_blank" rel="noopener">Ouvrir le produit ↗</a></main></body></html>'''
          (root/'case-studies/doberto-ff-proxy.html').write_text(case)
          sm=root/'sitemap.xml'; x=sm.read_text()
          url='https://dobertomrlit.zone.id/case-studies/doberto-ff-proxy.html'
          if url not in x: x=x.replace('</urlset>',f'  <url><loc>{url}</loc></url>\n</urlset>')
          sm.write_text(x)
          sp=root/'assets/project-sync.json'; data=json.loads(sp.read_text())
          repo='Doberto555/DOBERTO-FF-PROXY'
          if repo not in data['seen_repositories']: data['seen_repositories'].append(repo)
          if repo in data['portfolio_projects']: data['portfolio_projects'].remove(repo)
          data['portfolio_projects'].insert(0,repo)
          data['rules']['prefer_reliable_public_icon_url']=False
          data['rules']['prefer_verified_local_icon']=True
          sp.write_text(json.dumps(data,indent=2)+'\n')
      - name: Verify icon and project order
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('assets/project-icons/doberto-ff-proxy.svg')
          s=open('index.html').read(); assert s.index('DOBERTO FF PROXY</h3>') < s.index('DOBERTO MINI MD</h3>')
          assert 'doberto-ff-proxy.html' in open('sitemap.xml').read()
          PY
      - name: Commit portfolio sync
        run: |
          git config user.name 'DOBERTO MRLIT DEV'
          git config user.email '235633378+Doberto555@users.noreply.github.com'
          git add index.html assets/portfolio-ui.js assets/project-sync.json sitemap.xml case-studies/doberto-ff-proxy.html assets/project-icons/doberto-ff-proxy.svg
          git commit -m 'Add DOBERTO FF PROXY to portfolio'
          git push
