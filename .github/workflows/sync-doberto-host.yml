name: Sync DOBERTO HOST portfolio
on:
  push:
    paths: ['.github/workflows/sync-doberto-host.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DOBERTO HOST to portfolio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          idx=(root/'index.html').read_text()
          card='''<article class="project reveal" style="--accent:#7c5cff" data-no-live="true"><div class="product-mark"><img src="assets/project-icons/doberto-host.svg" width="82" height="82" alt="DOBERTO HOST icon" decoding="async" data-fallback="DH"></div><div class="project-main"><div class="project-title-row"><h3>DOBERTO HOST</h3><span class="source-private">Private source</span><span class="domain">Self-hosted · VPS</span></div><p>Self-hosted bot hosting storefront and dashboard with Pterodactyl provisioning, client controls and protected backend infrastructure.</p><div class="chips"><span class="chip">Node.js</span><span class="chip">Pterodactyl</span><span class="chip">VPS</span><span class="chip">Hosting</span></div></div><div class="project-actions"><a href="case-studies/doberto-host.html">Case study<span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></a></div></article>'''
          marker='<div class="project-list">'
          if 'case-studies/doberto-host.html' not in idx:
              idx=idx.replace(marker,marker+'\n'+card,1)
          idx=idx.replace('<b>7</b></div><div><small>Current</small><b>DOBERTO FF PROXY</b>','<b>8</b></div><div><small>Current</small><b>DOBERTO HOST</b>')
          idx=idx.replace('Developer behind DOBERTO FF PROXY, DOBERTO MINI MD, DOBERTO FLIX, AYITI MARKET, DOBERTO MD V3, DOBERTO VCF and NOVATOP.','Developer behind DOBERTO HOST, DOBERTO FF PROXY, DOBERTO MINI MD, DOBERTO FLIX, AYITI MARKET, DOBERTO MD V3, DOBERTO VCF and NOVATOP.')
          idx=idx.replace('assets/portfolio-ui.js?v=20260915-auto1','assets/portfolio-ui.js?v=20260922-host1')
          (root/'index.html').write_text(idx)

          js=(root/'assets/portfolio-ui.js').read_text()
          en="    {desc:'Self-hosted bot hosting storefront and dashboard with Pterodactyl provisioning, client controls and protected backend infrastructure.',chips:['Node.js','Pterodactyl','VPS','Hosting']},\n"
          fr="    {desc:'Plateforme d’hébergement de bots auto-hébergée avec boutique, tableau de bord, provisionnement Pterodactyl et infrastructure backend protégée.',chips:['Node.js','Pterodactyl','VPS','Hébergement']},\n"
          if "Self-hosted bot hosting storefront" not in js:
              js=js.replace("  en:[\n", "  en:[\n"+en,1)
              js=js.replace("  fr:[\n", "  fr:[\n"+fr,1)
          old="const acts=$$('.project-actions a',card);if(acts[0])setDirectText(acts[0],d.openLive);if(acts[1])setDirectText(acts[1],d.caseStudy)"
          new="const acts=$$('.project-actions a',card);if(card.dataset.noLive==='true'){if(acts[0])setDirectText(acts[0],d.caseStudy)}else{if(acts[0])setDirectText(acts[0],d.openLive);if(acts[1])setDirectText(acts[1],d.caseStudy)}"
          js=js.replace(old,new)
          (root/'assets/portfolio-ui.js').write_text(js)

          icon='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t d"><title id="t">DOBERTO HOST</title><desc id="d">DOBERTO HOST server logo</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#20d98f"/></linearGradient></defs><rect width="320" height="320" rx="72" fill="#080b12"/><rect x="58" y="62" width="204" height="64" rx="18" fill="none" stroke="url(#g)" stroke-width="12"/><rect x="58" y="148" width="204" height="64" rx="18" fill="none" stroke="url(#g)" stroke-width="12"/><circle cx="91" cy="94" r="8" fill="#20d98f"/><circle cx="91" cy="180" r="8" fill="#20d98f"/><path d="M126 94h102M126 180h102" stroke="#eef2ff" stroke-width="10" stroke-linecap="round"/><path d="M160 218v28M116 258h88" stroke="url(#g)" stroke-width="12" stroke-linecap="round"/></svg>'''
          (root/'assets/project-icons/doberto-host.svg').write_text(icon)

          case='''<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOBERTO HOST — Étude de cas | DOBERTO MRLIT DEV</title><meta name="description" content="DOBERTO HOST, plateforme auto-hébergée de vente et de gestion de serveurs de bots propulsée par Pterodactyl."><link rel="canonical" href="https://dobertomrlit.zone.id/case-studies/doberto-host.html"><link rel="stylesheet" href="../assets/portfolio.css?v=20260912-pro1"><link rel="stylesheet" href="../assets/portfolio-polish.css?v=20260905-cinematic7"><link rel="stylesheet" href="../assets/final-clean.css?v=20260912-pro2"><style>body{padding:6vw}.case{max-width:1100px;margin:auto}.back{display:inline-block;margin-bottom:48px}.heroicon{width:112px;height:112px;border-radius:28px}.case h1{font-size:clamp(52px,9vw,120px);line-height:.9;margin:24px 0}.case p{font-size:clamp(18px,2vw,25px);line-height:1.6;max-width:850px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.meta span{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 14px}</style></head><body><main class="case"><a class="back" href="../index.html#work">← Portfolio</a><img class="heroicon" src="../assets/project-icons/doberto-host.svg" alt="DOBERTO HOST icon"><h1>DOBERTO HOST</h1><p>Plateforme Node.js auto-hébergée conçue pour vendre, provisionner et administrer des serveurs de bots via Pterodactyl. Elle réunit inscription client, offres Starter / Pro / Ultra, commandes avec validation manuelle, tableau de bord administrateur et création automatique des utilisateurs et serveurs après approbation.</p><p>Le backend conserve les clés Pterodactyl côté serveur, fournit les données de ressources en direct et permet aux clients de démarrer, arrêter ou redémarrer leurs serveurs sans exposer les secrets d’infrastructure. La persistance SQLite convient au lancement et l’architecture prévoit une migration PostgreSQL pour une montée en charge.</p><div class="meta"><span>Node.js</span><span>Pterodactyl</span><span>VPS</span><span>SQLite</span><span>Backend sécurisé</span></div></main></body></html>'''
          (root/'case-studies/doberto-host.html').write_text(case)

          sm=(root/'sitemap.xml').read_text()
          sm=sm.replace('<url><loc>https://dobertomrlit.zone.id/</loc><lastmod>2026-09-15</lastmod>', '<url><loc>https://dobertomrlit.zone.id/</loc><lastmod>2026-09-22</lastmod>')
          entry='  <url><loc>https://dobertomrlit.zone.id/case-studies/doberto-host.html</loc><lastmod>2026-09-22</lastmod><priority>0.8</priority></url>\n'
          if 'doberto-host.html' not in sm: sm=sm.replace('</urlset>',entry+'</urlset>')
          (root/'sitemap.xml').write_text(sm)

          p=root/'assets/project-sync.json'; data=json.loads(p.read_text())
          repo='Doberto555/DOBERTO-HOST'
          if repo not in data['seen_repositories']: data['seen_repositories'].append(repo)
          data['portfolio_projects']=[repo]+[x for x in data['portfolio_projects'] if x!=repo]
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          wf=root/'.github/workflows/sync-doberto-host.yml'
          if wf.exists(): wf.unlink()
          PY
          git config user.name 'DOBERTO MRLIT DEV'
          git config user.email '235633378+Doberto555@users.noreply.github.com'
          git add -A
          git commit -m 'Add DOBERTO HOST to portfolio'
          git push
