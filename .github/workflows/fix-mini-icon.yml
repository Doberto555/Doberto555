name: Fix DOBERTO MINI MD icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace remote icon source
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'https://doberto-minibot-v1.vercel.app/bot-logo-v4.svg'
          new = 'https://raw.githubusercontent.com/Doberto555/DOBERTO-MINI-BOT-V1/main/bot-logo-v4.svg'
          changed = False
          for name in ['index.html', 'case-studies/doberto-mini-md.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed = True
          print('changed=', changed)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "DOBERTO MRLIT DEV"
          git config user.email "235633378+Doberto555@users.noreply.github.com"
          git add index.html case-studies/doberto-mini-md.html
          git commit -m "Fix DOBERTO MINI MD icon display"
          git pull --rebase origin main
          git push origin main
