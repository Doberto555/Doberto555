name: Finalize OG Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-og-meta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point social metadata to verified preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          image = 'https://dobertomrlit.zone.id/assets/og-preview-v2.jpg?v=20260905-final'

          s = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{image}">', s, count=1)
          s = re.sub(r'<meta property="og:image:secure_url" content="[^"]+">', '', s)
          needle = f'<meta property="og:image" content="{image}">'
          s = s.replace(needle, needle + f'<meta property="og:image:secure_url" content="{image}">', 1)
          s = re.sub(r'<meta property="og:image:width" content="[^"]+">', '<meta property="og:image:width" content="600">', s, count=1)
          s = re.sub(r'<meta property="og:image:height" content="[^"]+">', '<meta property="og:image:height" content="315">', s, count=1)
          s = re.sub(r'<meta name="twitter:image" content="[^"]+">', f'<meta name="twitter:image" content="{image}">', s, count=1)
          p.write_text(s, encoding='utf-8')

          # Keep case-study share cards consistent with the same verified image.
          for cp in Path('case-studies').glob('*.html'):
              t = cp.read_text(encoding='utf-8')
              t = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{image}">', t, count=1)
              cp.write_text(t, encoding='utf-8')
          PY

          rm -f assets/og-preview.jpg assets/og-preview-v2.txt assets/og-preview-v2.base64
          rm -f .github/workflows/build-og-preview.yml
          rm -f .github/workflows/finalize-og-meta.yml

      - name: Commit final social preview setup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize verified social preview image'
          git push
