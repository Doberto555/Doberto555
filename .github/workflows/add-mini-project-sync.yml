name: Apply MINI BOT portfolio update

on:
  push:
    paths:
      - 'scripts/add-mini-project.py'
      - '.github/workflows/add-mini-project-sync.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply project update
        run: python3 scripts/add-mini-project.py
      - name: Verify generated portfolio files
        run: |
          grep -q 'DOBERTO MINI MD' index.html
          grep -q 'DOBERTO MINI MD' case-studies/doberto-mini-md.html
          grep -q 'DOBERTO-MINI-BOT-V1' assets/project-sync.json
      - name: Commit generated portfolio update
        run: |
          git config user.name 'DOBERTO MRLIT DEV'
          git config user.email '235633378+Doberto555@users.noreply.github.com'
          git add index.html assets/portfolio-ui.js assets/case-ui.js assets/project-sync.json case-studies/doberto-mini-md.html sitemap.xml
          git diff --cached --quiet || git commit -m 'Add DOBERTO MINI MD to portfolio'
          git push
