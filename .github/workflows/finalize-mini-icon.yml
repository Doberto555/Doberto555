name: Finalize MINI MD icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use valid local SVG icon and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/project-icons/doberto-mini-md.jpg','assets/project-icons/doberto-mini-md.svg?v=20260915-final2')
          s=s.replace('assets/portfolio-ui.js?v=20260915-auto1','assets/portfolio-ui.js?v=20260915-final2')
          p.write_text(s,encoding='utf-8')

          p=Path('case-studies/doberto-mini-md.html')
          s=p.read_text(encoding='utf-8')
          for old in [
            '../../assets/project-icons/doberto-mini-md.jpg',
            '../assets/project-icons/doberto-mini-md.jpg?v=20260915-local1',
            '../assets/project-icons/doberto-mini-md.jpg'
          ]:
            s=s.replace(old,'../assets/project-icons/doberto-mini-md.svg?v=20260915-final2')
          p.write_text(s,encoding='utf-8')

          Path('assets/project-icons/doberto-mini-md.jpg').unlink(missing_ok=True)
          Path('.github/workflows/finalize-mini-icon.yml').unlink(missing_ok=True)
          PY
      - name: Verify
        run: |
          grep -q 'doberto-mini-md.svg?v=20260915-final2' index.html
          grep -q '../assets/project-icons/doberto-mini-md.svg?v=20260915-final2' case-studies/doberto-mini-md.html
          grep -q 'portfolio-ui.js?v=20260915-final2' index.html
          test -s assets/project-icons/doberto-mini-md.svg
      - name: Commit
        run: |
          git config user.name "DOBERTO MRLIT DEV"
          git config user.email "235633378+Doberto555@users.noreply.github.com"
          git add -A
          git commit -m "Use valid MINI MD SVG icon and refresh project cache"
          git pull --rebase origin main
          git push origin main
