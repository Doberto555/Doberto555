name: Fix case study bar and VCF domain
on:
  push:
    paths:
      - '.github/workflows/fix-case-domain.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Replace every stale Vercel production reference in the portfolio source.
          old = 'doberto-vcf-509.vercel.app'
          new = 'dobertovcf.online'
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in {'.html','.js','.json','.xml','.md','.css','.txt'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if old in s:
                  p.write_text(s.replace(old,new), encoding='utf-8')

          # Remove the decorative colored bar before the case-study kicker.
          css = Path('assets/case-study.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* No decorative kicker bar */'
          if marker not in s:
              s += '\n\n' + marker + '\n.kicker::before{display:none!important}.kicker{gap:0}\n'
          css.write_text(s, encoding='utf-8')

          # Force browsers to load the corrected shared case CSS/JS.
          for p in Path('case-studies').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('case-study.css?v=20260912-pro1','case-study.css?v=20260912-pro2')
              s = s.replace('case-ui.js?v=20260912-pro1','case-ui.js?v=20260912-pro2')
              p.write_text(s, encoding='utf-8')

          # Bump homepage script cache because its displayed project data changed.
          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          s = s.replace('portfolio-ui.js?v=20260912-pro1','portfolio-ui.js?v=20260912-pro2')
          idx.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          ! grep -R "doberto-vcf-509.vercel.app" index.html case-studies assets/case-ui.js
          grep -q "dobertovcf.online" case-studies/doberto-vcf.html
          grep -q "kicker::before{display:none!important}" assets/case-study.css
      - name: Commit
        run: |
          rm -f .github/workflows/fix-case-domain.yml
          git config user.name "DOBERTO MRLIT DEV"
          git config user.email "235633378+Doberto555@users.noreply.github.com"
          git add -A
          git commit -m "Fix case study bar and use DOBERTO VCF production domain"
          git push
